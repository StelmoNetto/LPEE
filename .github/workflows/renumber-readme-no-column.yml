name: Renumber README Nº column

on:
  push:
    paths:
      - 'parte_*/README.md'
      - 'pasta_*/README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renumber:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Renumber Nº column
        shell: bash
        run: |
          python .github/scripts/renumber_readme_table.py

      - name: Commit and push changes
        shell: bash
        run: |
          MODIFIED=$(git diff --name-only -- 'parte_*/README.md' 'pasta_*/README.md' 2>/dev/null || true)
          if [ -z "$MODIFIED" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "$MODIFIED" | xargs -r git add
          git commit -m "chore: renumber README Nº column"
          git push
